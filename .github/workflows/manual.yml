name: Sedstart Prod

on:
  workflow_dispatch:
  schedule:
    - cron: '18 10 * * *'

jobs:
  sedstart-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sedstart test run
        uses: sedinqa/sedstart@v1
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_PROD }}
          project_id: 854
          test_id: 8430
          profile_id: 1833
          browser: chrome
          headless: false
